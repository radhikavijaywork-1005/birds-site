<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aves — a quiet field guide</title>
  <meta name="description" content="A quiet field guide to the birds of the world. Names, pictures, voices." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 22 C 10 18, 16 12, 22 8 C 28 4, 36 4, 44 6 C 40 10, 34 14, 28 16 C 22 18, 14 20, 2 22 Z" />
        <path d="M28 16 L 34 22" />
        <circle cx="41" cy="8" r="0.6" fill="currentColor" />
      </svg>
    </div>
    <h1>Aves</h1>
    <p class="lede">A quiet field guide to the birds of the world. <span class="sep">·</span> Names, pictures, voices.</p>
  </header>

  <section class="controls" aria-label="search">
    <input id="search" type="search" placeholder="search by name, family, or place…" autocomplete="off" />
    <span class="count" id="count" aria-live="polite"></span>
  </section>

  <main id="grid" class="grid" aria-label="birds"></main>

  <template id="card-tpl">
    <article class="card" tabindex="0">
      <figure class="plate">
        <div class="plate-frame">
          <img alt="" loading="lazy" />
          <button class="play" aria-label="hear its voice" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="1" />
              <path class="icon-play" d="M8 6 L 14 10 L 8 14 Z" fill="currentColor" />
              <path class="icon-pause" d="M7.5 6.5 L 9 6.5 L 9 13.5 L 7.5 13.5 Z M 11 6.5 L 12.5 6.5 L 12.5 13.5 L 11 13.5 Z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </figure>
      <div class="meta">
        <h2 class="name"><a class="name-link"></a></h2>
        <p class="sci"></p>
      </div>
    </article>
  </template>

  <footer class="colophon">
    <p>Pictures from Wikimedia Commons. Voices from Xeno-canto, recorded by people who love birds.</p>
    <p class="quiet">Made slowly, for the love of it.</p>
  </footer>

  <audio id="player" preload="none"></audio>
  <script src="script.js" defer></script>
</body>
</html>
